name: APK de teste do novo layout

on:
  workflow_dispatch:
  push:
    branches: ["feat/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "android/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - ".github/workflows/build-layout-test.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Verify checkout and camera regressions
        run: |
          bunx tsc --noEmit
          node --test tests/*.test.mjs

      - name: Isolate preview app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text().replace('applicationId "app.minimarket.pos"', 'applicationId "app.minimarket.pos.visiontest"')
          p.write_text(s)
          p = Path('android/app/src/main/res/values/strings.xml')
          s = p.read_text()
          import re
          s = re.sub(r'(<string name="(?:app_name|title_activity_main)">).*?(</string>)', r'\1Mercadinho União — Teste\2', s)
          p.write_text(s)
          p = Path('src/routes/__root.tsx')
          s = p.read_text().replace('<AppUpdatePrompt />', '')
          p.write_text(s)
          PY

      - name: Build web app
        run: bun run build

      - name: Prepare Capacitor web assets
        run: |
          # TanStack Start SPA already writes the client output to dist/client.
          # Do not remove dist after the web build, otherwise the generated shell is destroyed.
          test -d dist/client
          if [ ! -f dist/client/index.html ] && [ -f dist/client/_shell.html ]; then
            cp dist/client/_shell.html dist/client/index.html
          fi
          test -f dist/client/index.html

      - name: Verify dock navigation in browser
        run: |
          npm install --prefix /tmp/mercadinho-browser --no-audit --no-fund playwright @axe-core/playwright
          /tmp/mercadinho-browser/node_modules/.bin/playwright install --with-deps chromium --only-shell
          python3 tests/serve-preview.py > /tmp/mercadinho-preview.log 2>&1 &
          PLAYWRIGHT_MODULE=/tmp/mercadinho-browser/node_modules/playwright node tests/navigation-browser.cjs
          PLAYWRIGHT_MODULE=/tmp/mercadinho-browser/node_modules/playwright node tests/pix-browser.cjs
          PLAYWRIGHT_MODULE=/tmp/mercadinho-browser/node_modules/playwright node tests/payments-browser.cjs
          PLAYWRIGHT_MODULE=/tmp/mercadinho-browser/node_modules/playwright node tests/scanner-browser.cjs
          PLAYWRIGHT_MODULE=/tmp/mercadinho-browser/node_modules/playwright node tests/promotions-browser.cjs
          PLAYWRIGHT_MODULE=/tmp/mercadinho-browser/node_modules/playwright AXE_MODULE=/tmp/mercadinho-browser/node_modules/@axe-core/playwright node tests/palette-browser.cjs
          PLAYWRIGHT_MODULE=/tmp/mercadinho-browser/node_modules/playwright AXE_MODULE=/tmp/mercadinho-browser/node_modules/@axe-core/playwright node tests/payment-dimensions-browser.cjs

          PLAYWRIGHT_MODULE=/tmp/mercadinho-browser/node_modules/playwright AXE_MODULE=/tmp/mercadinho-browser/node_modules/@axe-core/playwright node tests/management-browser.cjs
          PLAYWRIGHT_MODULE=/tmp/mercadinho-browser/node_modules/playwright AXE_MODULE=/tmp/mercadinho-browser/node_modules/@axe-core/playwright node tests/fiados-browser.cjs
          PLAYWRIGHT_MODULE=/tmp/mercadinho-browser/node_modules/playwright AXE_MODULE=/tmp/mercadinho-browser/node_modules/@axe-core/playwright node tests/replenishment-browser.cjs

      - name: Upload navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercadinho-navigation-screenshots
          path: navigation-screenshots/
          if-no-files-found: ignore

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Reuse test APK signing key
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/debug.keystore
            ~/.config/.android/debug.keystore
          key: mercadinho-vision-test-signing-v1

      - name: Build installable test APK with release packaging
        working-directory: android
        run: |
          ./gradlew testDebugUnitTest assembleRelease \
            -PtestApk=true \
            -PappVersionCode=${GITHUB_RUN_NUMBER} \
            -PappVersionName=layout-test.${GITHUB_RUN_NUMBER} \
            --no-daemon

      - name: Verify and package APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          python3 - "$APK" <<'PY'
          import sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as apk:
              assert not any('ocr' in name.lower() for name in apk.namelist()), 'OCR remains in APK'
          PY
          cp "$APK" Mercadinho-Uniao-Teste.apk
          sha256sum Mercadinho-Uniao-Teste.apk > Mercadinho-Uniao-Teste.sha256

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: mercado-uniao-layout-teste
          path: |
            Mercadinho-Uniao-Teste.apk
            Mercadinho-Uniao-Teste.sha256
          if-no-files-found: error

      - name: Publish separate test download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: layout-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Mercadinho União — APK de teste
          prerelease: true
          make_latest: false
          body: |
            Estoque baixo dinâmico: média líquida de vendas dos últimos30dias, ciclo de atacado e margem de segurança configuráveis (padrão7/2), cálculo integralmente local.
            Cards mostram sugestão de compra; exportação dos resultados visíveis em texto para WhatsApp e PDF local para impressão. Migração e backup preservam dados e parâmetros; Resumo/Gestão usam a mesma regra.
            Botão de fechar em Selecionar cliente circular44px, ícone centralizado e retorno do foco ao controle de origem.
            Spec Kit, Ponytail full e replica-test aplicados. Scanner, pagamentos, Fiados, paleta e assinatura de teste preservados.
            Instale sobre o APK teste existente sem desinstalar. Instala separadamente da versão oficial como Mercadinho União — Teste.
            Câmera, notificações bancárias, clipboard/impressão e instalação reais exigem conferência no aparelho. Não adiciona servidor, processamento bancário ou integração fiscal.
          files: |
            Mercadinho-Uniao-Teste.apk
            Mercadinho-Uniao-Teste.sha256
