name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, licenciamento]
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.ts"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: https://qmwnjhgckuifsipxsbao.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_TMzXxiwIFhT-h35rClIfIw_mtFagjm-

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun run build

      - name: Prepare Capacitor web assets
        run: |
          test -d .output/public
          rm -rf dist
          mkdir -p dist/client
          cp -R .output/public/. dist/client/

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-market-pos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
