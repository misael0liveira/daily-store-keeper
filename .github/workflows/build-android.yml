name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.ts"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: https://qmwnjhgckuifsipxsbao.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_TMzXxiwIFhT-h35rClIfIw_mtFagjm-

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun run build

      - name: Prepare Capacitor web assets
        run: |
          test -d .output/public
          rm -rf dist
          mkdir -p dist/client
          cp -R .output/public/. dist/client/

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/mini-market-release.keystore
          test -s android/app/mini-market-release.keystore

      - name: Verify release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -keystore android/app/mini-market-release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/mini-market-release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEYSTORE_PASSWORD" \
            --no-daemon

      - name: Remove signing keystore from workspace
        if: always()
        run: rm -f android/app/mini-market-release.keystore

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-market-pos-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
