name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://qmwnjhgckuifsipxsbao.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_TMzXxiwIFhT-h35rClIfIw_mtFagjm-
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static PWA
        run: bun run build -- --base=/daily-store-keeper/

      - name: Prepare GitHub Pages static output
        run: |
          set -e
          echo "=== Build output ==="
          for dir in .output/public dist/client dist; do
            if [ -d "$dir" ]; then
              echo "--- $dir ---"
              find "$dir" -maxdepth 2 -type f | sort | head -80
            fi
          done

          ROOT=""
          if [ -f ".output/public/index.html" ]; then
            ROOT=".output/public"
          elif [ -f "dist/client/index.html" ]; then
            ROOT="dist/client"
          elif [ -f "dist/index.html" ]; then
            ROOT="dist"
          fi

          if [ -z "$ROOT" ]; then
            echo "ERROR: no static index.html was generated."
            echo "=== Full output directories ==="
            find . -maxdepth 4 -type f \( -name 'index.html' -o -name '*.html' \) -print | sort
            exit 1
          fi

          echo "Publishing static root: $ROOT"
          rm -rf dist-pages
          mkdir -p dist-pages
          cp -R "$ROOT"/. dist-pages/

          if [ -f "dist/sw.js" ]; then
            cp dist/sw.js dist-pages/sw.js
          else
            echo "ERROR: dist/sw.js was not generated."
            exit 1
          fi
          for file in dist/workbox-*.js; do
            if [ -f "$file" ]; then
              cp "$file" dist-pages/"$(basename "$file")"
            fi
          done

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync, copyFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';

          const root = 'dist-pages';
          const base = '/daily-store-keeper/';
          const manifestPath = join(root, 'manifest.webmanifest');

          if (existsSync(manifestPath)) {
            const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
            manifest.id = base;
            manifest.start_url = base;
            manifest.scope = base;
            if (Array.isArray(manifest.icons)) {
              manifest.icons = manifest.icons.map((icon) => ({
                ...icon,
                src: icon.src.startsWith('/') ? `${base.replace(/\/$/, '')}${icon.src}` : icon.src,
              }));
            }
            if (Array.isArray(manifest.screenshots)) {
              manifest.screenshots = manifest.screenshots.map((shot) => ({
                ...shot,
                src: shot.src.startsWith('/') ? `${base.replace(/\/$/, '')}${shot.src}` : shot.src,
              }));
            }
            writeFileSync(manifestPath, JSON.stringify(manifest, null, 2));
          } else {
            throw new Error('manifest.webmanifest was not generated');
          }

          const htmlFiles = readdirSync(root, { recursive: true })
            .filter((file) => typeof file === 'string' && file.endsWith('.html'));
          for (const relative of htmlFiles) {
            const file = join(root, relative);
            let html = readFileSync(file, 'utf8');
            html = html
              .replaceAll('href="/manifest.webmanifest"', `href="${base}manifest.webmanifest"`)
              .replaceAll('href="/favicon.png"', `href="${base}favicon.png"`)
              .replaceAll('href="/icons/', `href="${base}icons/`)
              .replaceAll('src="/screenshots/', `src="${base}screenshots/`);
            writeFileSync(file, html);
          }

          const index = join(root, 'index.html');
          const fallback = join(root, '404.html');
          if (existsSync(index)) copyFileSync(index, fallback);
          NODE

          echo "=== Final PWA files ==="
          test -f dist-pages/index.html
          test -f dist-pages/manifest.webmanifest
          test -f dist-pages/sw.js
          test -f dist-pages/icons/icon-192.png
          test -f dist-pages/icons/icon-512.png
          find dist-pages -maxdepth 2 -type f | sort | grep -E '(^|/)(index.html|manifest.webmanifest|sw.js|workbox-.*\.js|icon-.*\.png)$' || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
